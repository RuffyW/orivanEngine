services:
  engine:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
volumes:
  ollama_models:
